<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerostar Academy • Elite Executive Exposé</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #010409;
            --surface: #0d1117;
            --aerostar-cyan: #38bdf8;
            --aerostar-indigo: #6366f1;
            --aerostar-gold: #fbbf24;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-glow: rgba(56, 189, 248, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
        [dir="rtl"] * { font-family: 'Tajawal', sans-serif !important; text-align: right; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 75%),
                url('https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .hud-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(1, 4, 9, 0.90), rgba(13, 17, 23, 0.96));
            z-index: 1;
            pointer-events: none;
        }

        .stage-container {
            width: 95vw;
            max-width: 1350px;
            height: 89vh;
            max-height: 850px;
            background: rgba(13, 17, 23, 0.92);
            backdrop-filter: blur(50px);
            border-radius: 40px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 140px rgba(0, 0, 0, 0.95), 0 0 60px rgba(56, 189, 248, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 3.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(1, 4, 9, 0.7);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--aerostar-cyan);
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px var(--aerostar-cyan);
        }

        .presenter-badge-top {
            font-size: 0.88rem;
            font-weight: 800;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(56, 189, 248, 0.2));
            color: #818cf8;
            padding: 7px 20px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
        }

        .lang-container {
            display: flex;
            background: rgba(1, 4, 9, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 4px;
        }

        .lang-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-tab.active {
            background: var(--aerostar-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 20px var(--aerostar-cyan);
        }

        @keyframes pageTransition {
            0% { opacity: 0; transform: translateY(25px) scale(0.98); filter: blur(6px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .slide-viewport {
            flex: 1;
            padding: 2.8rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: pageTransition 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .slide-viewport::-webkit-scrollbar { display: none; }

        .chapter-tag {
            font-size: 0.82rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            color: var(--aerostar-gold);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 1.2rem;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 40%, var(--aerostar-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .prose-content {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.85;
            margin-bottom: 1.2rem;
            max-width: 1100px;
        }
        .prose-content strong { color: var(--text-main); font-weight: 700; }

        .modern-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 0.8rem;
        }

        .modern-card {
            background: rgba(1, 4, 9, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-radius: 22px;
            padding: 1.5rem;
            transition: all 0.35s ease;
        }
        .modern-card:hover {
            border-color: var(--aerostar-cyan);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.18);
        }
        .modern-card h3 {
            font-size: 1.05rem;
            color: var(--aerostar-cyan);
            margin-bottom: 0.5rem;
            font-weight: 800;
        }
        .modern-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .hud-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(1, 4, 9, 0.75);
        }

        .progress-indicator {
            display: flex;
            gap: 12px;
        }

        .indicator-bar {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .indicator-bar.active {
            width: 45px;
            border-radius: 6px;
            background: var(--aerostar-cyan);
            box-shadow: 0 0 20px var(--aerostar-cyan);
        }

        .hud-btn {
            background: linear-gradient(135deg, var(--aerostar-cyan), #0284c7);
            color: var(--bg-deep);
            border: none;
            padding: 0.95rem 2.6rem;
            border-radius: 16px;
            font-weight: 900;
            font-size: 0.98rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .hud-btn:active { transform: scale(0.97); }
        .hud-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .climax-modal {
            position: fixed;
            inset: 0;
            background: rgba(1, 4, 9, 0.99);
            backdrop-filter: blur(40px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: pageTransition 0.5s ease forwards;
            padding: 2rem;
        }

        .climax-box {
            width: 100%;
            max-width: 950px;
            background: rgba(13, 17, 23, 0.98);
            border: 2px solid var(--aerostar-gold);
            border-radius: 40px;
            padding: 2.5rem;
            box-shadow: 0 0 140px rgba(251, 191, 36, 0.35);
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 1.5rem;
            border: 1px solid var(--aerostar-cyan);
            box-shadow: 0 0 30px var(--aerostar-cyan);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
    </style>
</head>
<body>

        function switchLanguage(lang) {
            activeLang = lang;
            document.getElementById('tab-en').classList.toggle('active', lang === 'en');
            document.getElementById('tab-fr').classList.toggle('active', lang === 'fr');
            document.getElementById('tab-ar').classList.toggle('active', lang === 'ar');
            
            const root = document.getElementById('html-root');
            if (lang === 'ar') {
                root.setAttribute('dir', 'rtl');
            } else {
                root.setAttribute('dir', 'ltr');
            }

            renderSlide();
        }

        function renderSlide() {
            const step = presentationSlides[currentIdx];
            const viewport = document.getElementById('slide-viewport');

            document.getElementById('presenter-display').innerText = step.presenter[activeLang];
            document.getElementById('prev-btn').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
            document.getElementById('next-btn').innerText = currentIdx === presentationSlides.length - 1 ? (activeLang === 'ar' ? '🚀 تشغيل فيديو النهاية' : activeLang === 'fr' ? 'Lancer la Vidéo Climax 🚀' : 'Launch Climax Video 🚀') : (activeLang === 'ar' ? 'الفصل التالي ←' : activeLang === 'fr' ? 'Chapitre Suivant →' : 'Next Chapter →');

            let html = `
                <div class="chapter-tag">${step.chapter[activeLang]}</div>
                <h1>${step.title[activeLang]}</h1>
            `;

            if (step.body) {
                html += `<p class="prose-content">${step.body[activeLang]}</p>`;
            }

            if (step.grid) {
                html += `<div class="modern-grid">`;
                step.grid[activeLang].forEach(card => {
                    html += `
                        <div class="modern-card">
                            <h3>${card.title}</h3>
                            <p>${card.text}</p>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            viewport.innerHTML = html;
            renderIndicators();
        }

        function renderIndicators() {
            const container = document.getElementById('progress-indicator');
            let barsHtml = '';
            for (let i = 0; i < presentationSlides.length; i++) {
                barsHtml += `<div class="indicator-bar ${i === currentIdx ? 'active' : ''}"></div>`;
            }
            container.innerHTML = barsHtml;
        }

        function nextSlide() {
            if (currentIdx < presentationSlides.length - 1) {
                currentIdx++;
                renderSlide();
            } else {
                triggerClimaxModal();
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        function triggerClimaxModal() {
            const modal = document.getElementById('climax-modal');
            const iframe = document.getElementById('youtube-embed');
            // Using youtube-nocookie embed URL with autoplay enabled for live deployment
            iframe.src = "https://www.youtube-nocookie.com/embed/4nJEaSkqk6w?autoplay=1";
            modal.style.display = 'flex';
        }

        function restartPresentation() {
            const modal = document.getElementById('climax-modal');
            const iframe = document.getElementById('youtube-embed');
            iframe.src = "";
            modal.style.display = 'none';
            currentIdx = 0;
            renderSlide();
        }

        // Initialize stage
        renderSlide();
    </script>
</body>
</html>
